name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Test job to run unittest
  PyTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with unittest
        run: |
          python -m unittest discover tests/

  # Security vulnerability tests using Bandit
  SecurityVulnerabilityTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit for Vulnerability Scanning
        run: |
          bandit -r . --output bandit-report.txt --format txt || true

      - name: Analyze Bandit Results
        run: |
          if grep -q "Issue:" bandit-report.txt; then
            echo "Vulnerabilities found, but continuing pipeline..."
          fi

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.txt

  # Broken Access Control Tests using OWASP ZAP
  BrokenAccessControlTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up OWASP ZAP
        run: |
          sudo apt update
          sudo apt install -y zaproxy

      - name: Run OWASP ZAP Scan for Broken Access Control
        run: |
          zap-baseline.py -t http://localhost:5000 -g gen.conf -r zap-bac-report.html || true

      - name: Upload ZAP Broken Access Control Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-bac-report
          path: zap-bac-report.html

  # OWASP ZAP for injection vulnerabilities
  InjectionTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Install flask, flask_sqlalchemy, flask_bcrypt, flask_migrate
      - name: Install Dependencies (flask, flask_sqlalchemy, flask_bcrypt, flask_migrate)
        run: |
          python -m pip install --upgrade pip
          pip install flask flask_sqlalchemy flask_bcrypt flask_migrate


      # Run Flask Application
      - name: Start Flask App
        run: |
          nohup python3 -m flask --app server --debug run --host=0.0.0.0 --port=5000 &

      - name: Wait for the server to be fully up and running
        run: |
          sleep 10

      # Install ZAP
      - name: Install ZAP from GitHub Release
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.16.0/ZAP_2.16.0_Linux.tar.gz
          tar -xvzf ZAP_2.16.0_Linux.tar.gz
          sudo mv ZAP_2.16.0 /opt/zaproxy
          sudo ln -s /opt/zaproxy/zap.sh /usr/local/bin/zap

      # Run OWASP ZAP Scan for Injection vulnerabilities
      - name: Run ZAP Scan for Injection vulnerabilities
        run: |
          /opt/zaproxy/zap.sh -cmd -quickurl http://localhost:5000 -quickout zap-injection-report.html || true

      # Upload ZAP Injection Report
      - name: Upload ZAP Injection Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-injection-report
          path: zap-injection-report.html