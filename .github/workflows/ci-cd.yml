name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "*.py"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Render CLI
        run: |
          curl -fsSL https://cdn.render.com/cli/installer.sh | bash
          export PATH="$HOME/.render/bin:$PATH"

      - name: Verify Render CLI installation
        run: |
          render --version

      - name: Login to Render
        run: |
          render login --api-key ${{ secrets.RENDER_API_KEY }}

      - name: Deploy to Render
        run: |
          render deploy --service Job-Vacancy-Board
