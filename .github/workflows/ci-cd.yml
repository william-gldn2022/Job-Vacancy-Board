name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Test job to run unittest
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with unittest
        run: |
          python -m unittest discover tests/

  # Deploy job to Render
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Render CLI
        run: |
          curl -fsSL https://cdn.render.com/cli/installer.sh | bash
          echo 'export PATH="$HOME/.render/bin:$PATH"' >> ~/.bashrc
          source ~/.bashrc

      - name: Verify Render CLI installation
        run: |
          render --version

      - name: Login to Render
        run: |
          render login --api-key ${{ secrets.RENDER_API_KEY }}

      - name: Deploy to Render
        run: |
          render deploy --service Job-Vacancy-Board