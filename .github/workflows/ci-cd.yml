name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Test job to run unittest
  PyTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with unittest
        run: |
          python -m unittest discover tests/

  # Security vulnerability tests using Bandit
  SecurityVulnerabilityTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit for Vulnerability Scanning
        run: |
          bandit -r . --output bandit-report.txt --format txt || true

      - name: Analyze Bandit Results
        run: |
          if grep -q "Issue:" bandit-report.txt; then
            echo "Vulnerabilities found, but continuing pipeline..."
          fi

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.txt

  # Broken Access Control Tests using OWASP ZAP
  BrokenAccessControlTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up OWASP ZAP
        run: |
          sudo apt update
          sudo apt install -y zaproxy

      - name: Run OWASP ZAP Scan for Broken Access Control
        run: |
          zap-baseline.py -t http://localhost:5000 -g gen.conf -r zap-bac-report.html || true

      - name: Upload ZAP Broken Access Control Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-bac-report
          path: zap-bac-report.html

  # OWASP ZAP for injection vulnerabilities
  # OWASP ZAP for injection vulnerabilities
  InjectionTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Run OWASP ZAP Scan for Injection vulnerabilities using Docker
        run: |
          # Ensure the latest ZAP Docker image is pulled
          docker pull owasp/zap2docker-stable:latest
          
          # Run the ZAP baseline scan
          docker run --rm -v $(pwd):/zap/wrk/:rw owasp/zap2docker-stable:latest zap-baseline.py -t http://localhost:5000 -g gen.conf -r zap-report.html || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

