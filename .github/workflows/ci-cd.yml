name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Test job to run pytest
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest test/  # Assuming your tests are in a folder named "test"

  # Deploy job to Render
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()  # Only deploy if the test job is successful

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Render CLI
        run: |
          curl -fsSL https://render.com/cli/install.sh | bash
          export PATH="$HOME/.render/bin:$PATH"
        
      - name: Login to Render
        run: render login --api-key ${{ secrets.RENDER_API_KEY }}  # Add RENDER_API_KEY to GitHub secrets

      - name: Deploy to Render
        run: |
          render deploy --service Job-Vacancy-Board

